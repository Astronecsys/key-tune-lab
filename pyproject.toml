[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "key-tune-lab"
version = "0.3.0"
description = "Standalone real-time MIDI, microtonal tuning, synthesis, and visual presentation workbench."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "mido>=1.3,<2",
  "numpy>=1.26,<3",
  "python-rtmidi>=1.5,<2",
  "soundcard>=0.4,<0.5",
  "sounddevice>=0.5,<1",
  "uvicorn>=0.30,<1",
  "websockets>=14,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
key-tune-panel = "music_lab.panel:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
music_lab = ["web/*", "presets/tunings/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
